name: Update data and deploy

# 每日由 FRED 抓官方數據 → 測試及檢查 → 官方數據有新一期才 commit → 部署 GitHub Pages。
# 公開 repo 的 Actions 分鐘及 Pages 均免費，不佔 RS Terminal 私人 repo 的 Actions 預算，亦不依賴 Mac 開機。
# 主觸發：cron-job.org job「usd-liquidity update」以 workflow_dispatch 每日香港 03:30、06:30、21:30 觸發（準時）。
# 後備：以下 GitHub 排程每 3 小時一次（UTC 00:20、03:20…21:20）。官方數據在不同時間公布（H.4.1 週四美國下午、
# SOFR／ON RRP 美國早上、殖利率翌日），多次抓取可較早接住新一期。
# 2026-09-30 實測：本帳戶 GitHub 排程會遲 3 小時以上，亦會整班丟失（RS 20:38 班遲至 23:55；
# qp-discord-relay 每小時班只跑了幾次），所以用較密的班次增加成功機會。公開 repo 跑多少次都免費；
# 官方數據沒有新一期就不 commit，只重新部署以更新「最後自動抓取」時間。
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "tests/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 正常約 1 分鐘；卡死上限 10 分鐘
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test rules
        run: npm test
      - name: Fetch FRED data
        run: node scripts/build-data.mjs
      - name: Commit when official data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # raw.json 只有官方數據、沒有時間戳：沒有新一期就不 commit，
          # 但仍然部署，網頁的「最後自動抓取」時間會更新。
          git add data/raw.json
          if git diff --cached --quiet; then
            echo "官方數據沒有新一期，不 commit"
          else
            git add site/data/liquidity.json
            git commit -m "data: FRED update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
